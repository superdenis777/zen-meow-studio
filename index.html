<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeowChat 2003</title>
<!-- Pixel fonts. DotGothic16 covers Traditional Chinese. Offline, everything falls back to system fonts and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ---------- Themes: every color the desktop uses lives here ---------- */
  :root, html[data-theme="midnight"] {          /* Midnight Dial-Up */
    --desk: #1fb5ad;
    --desk-dot: #189a93;
    --win: #fff6dc;
    --title-a: #ff4fa3;
    --title-b: #7a5cff;
    --log-bg: #0d0b2a;
    --log-ink: #e9e6ff;
    --sys: #8be9fd;
    --lime: #39ff14;
    --wall-a: #ffd7f0;
    --wall-b: #ffc4e6;
    --floor-a: #7fd4ff;
    --floor-b: #5ec0f2;
    --chrome: #d9d0ea;
    --chrome-2: #efe6ff;
  }
  html[data-theme="sunset"] {                   /* Sunset CRT */
    --desk: #f0a35e;
    --desk-dot: #dd8c4a;
    --win: #fff1e0;
    --title-a: #ff6b5b;
    --title-b: #ff9f43;
    --log-bg: #2a1410;
    --log-ink: #ffe9d6;
    --sys: #ffc58a;
    --lime: #ffb000;
    --wall-a: #ffe0c2;
    --wall-b: #ffd0a8;
    --floor-a: #ffb38a;
    --floor-b: #f79a6e;
    --chrome: #f3d9c2;
    --chrome-2: #fff0e2;
  }
  html[data-theme="matcha"] {                   /* Cyber Matcha */
    --desk: #2f4a3a;
    --desk-dot: #27402f;
    --win: #eef3e2;
    --title-a: #8fc28f;
    --title-b: #2f6b4f;
    --log-bg: #0f1f17;
    --log-ink: #e3f2dc;
    --sys: #b8e6a0;
    --lime: #a6ff7a;
    --wall-a: #dfe9cf;
    --wall-b: #cfdcbc;
    --floor-a: #9cc5a1;
    --floor-b: #86b38c;
    --chrome: #cfdcc4;
    --chrome-2: #eef3e2;
  }
  html[data-theme="rose"] {                     /* Rose Quartz */
    --desk: #c9b6ff;
    --desk-dot: #b9a3f5;
    --win: #fff4fb;
    --title-a: #ff9ecf;
    --title-b: #b18cff;
    --log-bg: #2b1d3f;
    --log-ink: #fbeaff;
    --sys: #ffc4e6;
    --lime: #ffb3dc;
    --wall-a: #ffe3f1;
    --wall-b: #ffd3ea;
    --floor-a: #e6d4ff;
    --floor-b: #d8c2ff;
    --chrome: #ecdcf5;
    --chrome-2: #fff4fb;
  }

  :root {
    --ink: #1a1030;
    --bevel-hi: #ffffff;
    --bevel-lo: #8a7f9c;
    --you: #ffe347;
    --sun: #ffb000;
    --cjk: "DotGothic16", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    --pixel: "Press Start 2P", var(--cjk);
    --term: "VT323", var(--cjk);
    --fs-xs: 8px;
    --fs-s: 9px;
    --fs-m: 11px;
    --sprite: 5px; /* size of one cat pixel */
  }
  /* CJK glyphs need more pixels than Press Start 2P to stay legible */
  html[lang="zh-Hant"] { --fs-xs: 11px; --fs-s: 12px; --fs-m: 14px; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { margin: 0; min-height: 100%; }

  body {
    background-color: var(--desk);
    background-image:
      radial-gradient(var(--desk-dot) 1.5px, transparent 1.6px),
      radial-gradient(var(--desk-dot) 1.5px, transparent 1.6px);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    color: var(--ink);
    font-family: var(--term);
    font-size: 20px;
    padding: 0 0 64px;
    transition: background-color .3s steps(3);
  }
  /* Sunset CRT: scanlines + a warm vignette over everything */
  html[data-theme="sunset"] body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(60, 20, 0, .07) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(120, 40, 0, .22));
  }
  .page { padding: 16px; }

  /* ---------- Top menu bar ---------- */
  .menubar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 6px 8px;
    padding: 5px 10px;
    background: var(--chrome);
    border-bottom: 3px solid #fff;
    box-shadow: 0 3px 0 var(--ink);
    font-family: var(--pixel);
    font-size: var(--fs-s);
  }
  .mb-brand { margin-right: auto; white-space: nowrap; font-size: 9px; }
  .mb-brand b { color: var(--title-b); }
  .mb-btn, .seg button, .mb-select {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 8px;
    font-family: var(--pixel);
    font-size: var(--fs-s);
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 0;
    box-shadow: inset -2px -2px 0 var(--bevel-lo);
    cursor: pointer;
    white-space: nowrap;
  }
  .mb-select { font-size: var(--fs-xs); padding: 0 4px; max-width: 170px; }
  .mb-btn:active, .seg button:active { box-shadow: inset 2px 2px 0 var(--bevel-lo); }
  .seg { display: inline-flex; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
  .seg button[data-lang="zh"] { font-family: var(--cjk); font-size: 13px; }
  .mb-btn[aria-pressed="true"], .mb-btn[aria-expanded="true"] { background: var(--lime); }
  .ico svg { display: block; width: 18px; height: 18px; }
  #soundBtn .ico-off { display: none; }
  #soundBtn[data-on="false"] .ico-on { display: none; }
  #soundBtn[data-on="false"] .ico-off { display: block; }
  .release { background: var(--you); }
  .release .short { display: none; }
  .release.nudge { animation: nudge .5s steps(2) 8; }
  @keyframes nudge { 50% { background: var(--sun); transform: translateY(-2px); } }

  /* ---------- Banner ---------- */
  .banner {
    max-width: 1100px;
    margin: 0 auto 16px;
    text-align: center;
  }
  .logo {
    font-family: var(--pixel);
    font-size: clamp(22px, 5vw, 44px);
    margin: 8px 0 12px;
    color: #fff;
    letter-spacing: 2px;
    text-shadow:
      3px 3px 0 var(--title-a),
      6px 6px 0 var(--title-b),
      9px 9px 0 var(--ink);
  }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .marquee {
    overflow: hidden;
    white-space: nowrap;
    background: var(--ink);
    color: var(--lime);
    border: 3px solid #fff;
    outline: 3px solid var(--ink);
    padding: 4px 0;
    font-size: 22px;
  }
  .marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 30s linear infinite;
  }
  @keyframes scroll { to { transform: translateX(-100%); } }
  html[lang="zh-Hant"] .marquee { font-size: 18px; }

  .badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }
  .badge {
    font-family: var(--pixel);
    font-size: var(--fs-xs);
    line-height: 1.6;
    padding: 4px 6px;
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .badge.hot { background: var(--you); }
  .badge.net { background: #c7f0ff; }

  /* ---------- Windows ---------- */
  .desktop {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  .window {
    background: var(--win);
    border: 3px solid var(--ink);
    box-shadow:
      inset 3px 3px 0 var(--bevel-hi),
      inset -3px -3px 0 var(--bevel-lo),
      6px 6px 0 var(--ink);
    min-width: 0;
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 10px;
    background: linear-gradient(90deg, var(--title-a), var(--title-b));
    color: #fff;
    font-family: var(--pixel);
    font-size: var(--fs-m);
    border-bottom: 3px solid var(--ink);
    text-shadow: 2px 2px 0 var(--ink);
  }
  .titlebar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titlebar .icon { width: 14px; height: 14px; background: var(--you); border: 2px solid var(--ink); flex: none; }
  .winbtn {
    width: 22px; height: 20px;
    padding: 0;
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--ink);
    background: #e4dcf2;
    border: 2px solid var(--ink);
    box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 var(--bevel-lo);
    cursor: pointer;
    flex: none;
  }
  .winbtn:active { box-shadow: inset -2px -2px 0 #fff, inset 2px 2px 0 var(--bevel-lo); }
  .winbody { padding: 12px; }

  /* ---------- Lobby room ---------- */
  .room {
    position: relative;
    border: 3px solid var(--ink);
    overflow: hidden;
    background:
      repeating-linear-gradient(90deg, var(--wall-a) 0 16px, var(--wall-b) 16px 32px) top / 100% 55% no-repeat,
      repeating-conic-gradient(var(--floor-a) 0 25%, var(--floor-b) 0 50%) 0 0 / 32px 32px;
    padding: 96px 8px 14px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px;
  }
  .room::before { /* skirting board */
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 55%;
    height: 6px;
    background: var(--ink);
  }
  .poster {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--you);
    font-family: var(--pixel);
    font-size: var(--fs-xs);
    padding: 6px 8px;
    border: 3px solid #fff;
    box-shadow: 3px 3px 0 var(--ink);
    white-space: nowrap;
  }

  .cat {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: 0;
    padding: 4px 0 0;
    cursor: pointer;
    font: inherit;
    color: inherit;
    min-width: 0;
  }
  .cat:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }

  .cat .arrow {
    position: absolute;
    top: -14px;
    width: 0; height: 0;
    border: 9px solid transparent;
    border-top: 12px solid var(--you);
    border-bottom: 0;
    filter: drop-shadow(2px 2px 0 var(--ink));
    visibility: hidden;
  }
  .cat[aria-checked="true"] .arrow { visibility: visible; animation: hop .6s steps(2) infinite; }
  @keyframes hop { 50% { transform: translateY(-4px); } }

  .rig { position: relative; width: calc(22 * var(--sprite)); height: calc(23 * var(--sprite)); }
  .rig svg { position: absolute; display: block; }
  .rig .sprite { left: 0; top: 0; width: calc(22 * var(--sprite)); height: calc(21 * var(--sprite)); }
  .rig .laptop { left: calc(4 * var(--sprite)); bottom: 0; width: calc(14 * var(--sprite)); height: calc(9 * var(--sprite)); }

  .cat.typing .sprite { animation: bob .36s steps(2) infinite; }
  .cat.typing .laptop { animation: jiggle .18s steps(2) infinite; }
  .cat.slow.typing .sprite { animation-duration: .7s; }
  @keyframes bob { 50% { transform: translateY(calc(-1 * var(--sprite))); } }
  @keyframes jiggle { 50% { transform: translateX(1px); } }

  .shadow {
    width: calc(16 * var(--sprite));
    height: 8px;
    margin-top: -4px;
    border-radius: 50%;
    background: rgba(26, 16, 48, .25);
  }
  .nameplate {
    margin-top: 6px;
    max-width: 100%;
    padding: 3px 6px;
    font-family: var(--pixel);
    font-size: 8px;
    line-height: 1.5;
    color: #fff;
    background: var(--ink);
    border: 2px solid #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat[aria-checked="true"] .nameplate { background: var(--cat-color); color: var(--ink); border-color: var(--ink); }

  /* six tiny lamps: where this cat is on its arc */
  .lamps { display: flex; gap: 3px; margin-top: 5px; }
  .lamps i { width: 7px; height: 7px; background: rgba(26, 16, 48, .25); border: 1px solid var(--ink); }
  .lamps i.on { background: var(--cat-color); box-shadow: 0 0 6px var(--cat-color); }

  .bubble {
    position: absolute;
    bottom: calc(100% - 4px);
    left: 50%;
    width: max-content;
    max-width: 100%; /* stay inside this cat's column so bubbles never collide */
    padding: 4px 6px;
    overflow-wrap: anywhere;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 6px;
    box-shadow: 3px 3px 0 var(--ink);
    font-size: 17px;
    line-height: 1.05;
    text-align: left;
    transform: translateX(-50%) scale(0);
    transform-origin: 50% 100%;
    transition: transform .12s steps(3);
    pointer-events: none;
    z-index: 2;
  }
  html[lang="zh-Hant"] .bubble { font-size: 13px; line-height: 1.3; }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -9px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: var(--ink);
    border-bottom: 0;
  }
  .bubble span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .bubble b { color: var(--cat-color); -webkit-text-stroke: .4px var(--ink); }
  .bubble.show { transform: translateX(-50%) scale(1); }

  .roster {
    margin-top: 12px;
    display: grid;
    gap: 8px;
  }
  .roster p { margin: 0; line-height: 1.1; }
  html[lang="zh-Hant"] .roster p { font-size: 16px; line-height: 1.4; }
  .roster b { font-family: var(--pixel); font-size: 9px; color: var(--ink); background: var(--cat-color); padding: 2px 4px; border: 2px solid var(--ink); margin-right: 6px; }

  /* ---------- Chat ---------- */
  .log {
    height: 360px;
    overflow-y: auto;
    padding: 10px;
    background: var(--log-bg);
    color: var(--log-ink);
    border: 3px solid var(--ink);
    box-shadow: inset 3px 3px 0 #000;
    font-size: 20px;
    line-height: 1.15;
    scrollbar-color: var(--title-b) var(--log-bg);
  }
  html[lang="zh-Hant"] .log { font-size: 17px; line-height: 1.4; }
  .msg { margin: 0 0 6px; overflow-wrap: anywhere; }
  .msg .time { color: #8a84b3; }
  .msg.sys { color: var(--sys); }
  .msg.you .nick { color: var(--you); }
  .msg.care { color: #ffd1e8; }

  /* save-to-notebook star */
  .star {
    display: inline-flex;
    vertical-align: middle;
    width: 20px; height: 20px;
    margin-left: 4px;
    padding: 2px;
    color: #fff;
    background: none;
    border: 0;
    cursor: pointer;
    opacity: .5;
  }
  .star svg { width: 100%; height: 100%; display: block; }
  .star:hover, .star:focus-visible { opacity: 1; }
  .star[aria-pressed="true"] { opacity: 1; color: var(--you); }
  .star:focus-visible { outline: 2px dashed var(--you); }
  .log .star svg rect[fill="#1a1030"] { fill: #8a84b3; }

  .status {
    height: 26px;
    margin: 8px 0;
    padding: 2px 8px;
    font-size: 18px;
    background: var(--chrome-2);
    border: 2px solid var(--ink);
    box-shadow: inset 2px 2px 0 var(--bevel-lo);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  html[lang="zh-Hant"] .status { font-size: 15px; }

  .to {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-family: var(--pixel);
    font-size: var(--fs-s);
  }
  .chip {
    font-family: var(--pixel);
    font-size: 9px;
    padding: 6px 8px;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    cursor: pointer;
  }
  .chip[aria-checked="true"] { background: var(--cat-color); transform: translate(2px, 2px); box-shadow: none; }

  .prompt { display: flex; gap: 8px; }
  .field {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    background: var(--log-bg);
    border: 3px solid var(--ink);
    box-shadow: inset 3px 3px 0 #000;
    padding: 0 8px;
    color: var(--lime);
  }
  .field label { flex: none; font-size: 20px; margin-right: 6px; }
  .field input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--lime);
    caret-color: var(--lime);
    font-family: var(--term);
    font-size: 22px;
    padding: 6px 0;
  }
  html[lang="zh-Hant"] .field input { font-size: 17px; }
  .field input::placeholder { color: var(--lime); opacity: .45; }
  .field:focus-within { outline: 3px dashed var(--title-a); outline-offset: 2px; }

  .send {
    flex: none;
    font-family: var(--pixel);
    font-size: var(--fs-m);
    padding: 0 14px;
    color: var(--ink);
    background: var(--you);
    border: 3px solid var(--ink);
    box-shadow: inset 3px 3px 0 #fff8b0, inset -3px -3px 0 #c9a800, 3px 3px 0 var(--ink);
    cursor: pointer;
  }
  .send:active { transform: translate(3px, 3px); box-shadow: inset 3px 3px 0 #c9a800; }

  .shake { animation: shake .3s steps(4); }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* ---------- Zen Notebook ---------- */
  .notebook { grid-column: 1 / -1; }
  .nb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .nb-empty { margin: 4px 0; color: #6f6a99; }
  html[lang="zh-Hant"] .nb-empty { font-size: 16px; }
  .nb-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px 10px 16px;
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .nb-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--cat-color, var(--sun)); border-right: 2px solid var(--ink); }
  .nb-head { display: flex; align-items: center; gap: 6px; padding-right: 26px; font-family: var(--pixel); font-size: var(--fs-xs); line-height: 1.6; }
  .nb-head b { color: var(--ink); background: var(--cat-color, var(--you)); padding: 1px 4px; border: 2px solid var(--ink); font-weight: normal; }
  .nb-head time { color: #6f6a99; margin-left: auto; }
  .nb-card p { margin: 0; line-height: 1.1; }
  html[lang="zh-Hant"] .nb-card p, html[lang="zh-Hant"] .nb-card li { font-size: 16px; line-height: 1.4; }
  .nb-card ul { margin: 0; padding-left: 18px; font-size: 17px; line-height: 1.1; }
  .nb-card .nb-lucky { font-size: 17px; color: #6f6a99; }
  .nb-del { position: absolute; top: 6px; right: 6px; }

  /* ---------- Dialog windows (Release card, Dissolve box) ---------- */
  .card {
    width: min(380px, calc(100% - 32px));
    max-height: calc(100% - 32px);
    padding: 0;
    color: var(--ink);
    background: var(--win);
    border: 3px solid var(--ink);
    box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 var(--bevel-lo), 8px 8px 0 var(--ink);
  }
  .card[open] { animation: flip .32s steps(4); }
  @keyframes flip { from { transform: perspective(600px) rotateY(90deg); } }
  .card::backdrop {
    background: repeating-conic-gradient(rgba(13, 11, 42, .75) 0 25%, rgba(13, 11, 42, .55) 0 50%) 0 0 / 4px 4px;
  }
  .card-body { position: relative; padding: 16px 18px 18px; text-align: center; }
  .card-no { font-family: var(--pixel); font-size: var(--fs-xs); color: var(--title-b); }
  .card-star { position: absolute; top: 8px; right: 10px; width: 32px; height: 32px; margin: 0; opacity: 1; }
  .card-star[aria-pressed="false"] { color: #fff; }
  .card-sun { width: 66px; height: 66px; margin: 12px auto; }
  .card-sun svg { width: 100%; height: 100%; display: block; animation: spin 8s steps(8) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fortune {
    margin: 0 0 14px;
    padding: 10px;
    font-size: 24px;
    line-height: 1.1;
    background: #fff;
    border: 2px dashed var(--title-a);
  }
  html[lang="zh-Hant"] .fortune { font-size: 19px; line-height: 1.45; }
  .card h3 { margin: 0 0 6px; font-family: var(--pixel); font-size: var(--fs-xs); font-weight: normal; }
  .ritual { margin: 0 0 12px; padding: 0; list-style: none; text-align: left; }
  .ritual li { padding: 3px 0 3px 22px; position: relative; line-height: 1.1; }
  html[lang="zh-Hant"] .ritual li { font-size: 16px; line-height: 1.4; }
  .ritual li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 9px; height: 9px; background: var(--lime); border: 2px solid var(--ink); }
  .lucky { margin: 0 0 16px; }
  html[lang="zh-Hant"] .lucky { font-size: 16px; }
  .card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .card-actions .send { padding: 10px 14px; }
  .card-actions .chip { font-size: var(--fs-s); padding: 10px 12px; }

  /* Burn the Thought */
  .dissolve { width: min(440px, calc(100% - 32px)); }
  .dissolve .send { padding: 10px 16px; }
  .dissolve .hint { margin: 0 0 10px; text-align: left; line-height: 1.1; }
  html[lang="zh-Hant"] .dissolve .hint { font-size: 15px; line-height: 1.45; }
  .burn {
    position: relative;
    margin-bottom: 14px;
    background: var(--log-bg);
    border: 3px solid var(--ink);
    box-shadow: inset 3px 3px 0 #000;
  }
  .burn textarea, .burn .embers {
    display: block;
    width: 100%;
    min-height: 120px;
    margin: 0;
    padding: 10px;
    font-family: var(--term);
    font-size: 22px;
    line-height: 1.2;
    color: #ffd8b0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    text-align: left;
  }
  html[lang="zh-Hant"] .burn textarea, html[lang="zh-Hant"] .burn .embers { font-size: 18px; line-height: 1.45; }
  .burn textarea { resize: none; background: transparent; border: 0; outline: 0; caret-color: var(--sun); }
  .burn textarea::placeholder { color: #ffd8b0; opacity: .4; }
  .burn:focus-within { outline: 3px dashed var(--sun); outline-offset: 2px; }
  .burn .embers { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .burn.burning textarea { visibility: hidden; }
  .embers .ch { display: inline-block; white-space: pre; animation: ember 1.5s steps(9) forwards; animation-delay: var(--d); }
  @keyframes ember {
    0%   { color: #ffd8b0; }
    25%  { color: #ffb000; text-shadow: 0 0 6px #ff6b00; }
    55%  { color: #fff6b0; text-shadow: 0 0 10px #ffe347; opacity: 1; }
    100% { color: #fff; text-shadow: 0 0 14px #fff; transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }
  .spark {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--c);
    box-shadow: 0 0 6px var(--c);
    animation: spark 1.3s steps(8) forwards;
    animation-delay: var(--d);
    opacity: 0;
  }
  @keyframes spark {
    0%   { opacity: 0; transform: translate(0, 0); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.5); }
  }
  .mochi-note {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 0;
    padding: 8px 10px;
    text-align: left;
    line-height: 1.1;
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    animation: fadein .8s steps(4);
  }
  .mochi-note svg { width: 44px; height: 42px; flex: none; }
  html[lang="zh-Hant"] .mochi-note { font-size: 16px; line-height: 1.4; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- Ambience panel ---------- */
  .panel {
    position: fixed;
    top: 50px;
    right: 12px;
    z-index: 25;
    width: min(300px, calc(100% - 24px));
  }
  .vol { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-family: var(--pixel); font-size: var(--fs-xs); }
  .vol input { flex: 1; min-width: 0; accent-color: var(--title-b); }
  .toggles { display: grid; gap: 6px; }
  .tog {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    font-family: var(--term);
    font-size: 20px;
    text-align: left;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    cursor: pointer;
  }
  html[lang="zh-Hant"] .tog { font-size: 16px; }
  .tog .box { width: 14px; height: 14px; flex: none; border: 2px solid var(--ink); background: #fff; }
  .tog[aria-pressed="true"] { background: var(--chrome-2); }
  .tog[aria-pressed="true"] .box { background: var(--lime); box-shadow: inset 0 0 0 2px #fff; }
  .amb-note { margin: 10px 0 0; font-size: 16px; line-height: 1.1; color: #6f6a99; }
  html[lang="zh-Hant"] .amb-note { font-size: 13px; line-height: 1.4; }

  /* ---------- Stepped-away screen ---------- */
  .away {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    padding: 16px;
    background: repeating-conic-gradient(#0d0b2a 0 25%, #151236 0 50%) 0 0 / 4px 4px;
    color: #e9e6ff;
    text-align: center;
  }
  .away-box { max-width: 460px; }
  .away-cats { display: flex; justify-content: center; gap: 10px; opacity: .55; filter: saturate(.5); }
  .away-cats svg { width: 66px; height: 63px; }
  .zzz { margin: 4px 0 12px; color: #8be9fd; font-size: 26px; animation: blink 2s steps(1) infinite; }
  .away h2 { margin: 0 0 10px; font-family: var(--pixel); font-size: var(--fs-m); color: var(--you); font-weight: normal; line-height: 1.6; }
  .away p { margin: 0 0 20px; line-height: 1.2; }
  html[lang="zh-Hant"] .away p { font-size: 17px; line-height: 1.5; }
  .away .send { padding: 10px 16px; }

  /* ---------- Taskbar ---------- */
  .taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--chrome);
    border-top: 3px solid #fff;
    box-shadow: 0 -3px 0 var(--ink);
    font-family: var(--pixel);
    font-size: var(--fs-s);
    z-index: 10;
  }
  .start {
    font-family: var(--pixel);
    font-size: var(--fs-m);
    padding: 6px 10px;
    background: var(--lime);
    border: 2px solid var(--ink);
    box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .6), inset -2px -2px 0 rgba(0, 0, 0, .25);
    cursor: pointer;
  }
  .tray { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 3px 6px; border: 2px solid var(--bevel-lo); box-shadow: inset 2px 2px 0 var(--bevel-lo); background: var(--chrome-2); white-space: nowrap; font-size: 9px; }
  .task { padding: 6px 8px; border: 2px solid var(--ink); background: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font: inherit; color: var(--ink); }
  button.task { cursor: pointer; }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px;
    font-family: var(--pixel);
    font-size: var(--fs-xs);
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    cursor: pointer;
  }
  .live .led { width: 8px; height: 8px; border: 1px solid var(--ink); background: #9a94b8; }
  .live[data-state="idle"] .led { background: #c7f0c0; }
  .live[data-state="live"] .led { background: #39ff14; box-shadow: 0 0 6px #39ff14; }
  .live[data-state="fallback"] .led { background: #ffb000; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Small screens ---------- */
  @media (max-width: 820px) {
    .desktop { grid-template-columns: minmax(0, 1fr); }
    .log { height: 300px; }
  }
  @media (max-width: 640px) {
    .release .full { display: none; }
    .release .short { display: inline; }
    .mb-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .mb-select { max-width: 112px; }
  }
  @media (max-width: 480px) {
    :root { --sprite: 3.5px; }
    body { font-size: 18px; }
    .mb-brand { display: none; }
    .room { padding-top: 84px; }
    .bubble { font-size: 15px; }
    .nameplate { font-size: 6px; }
    .task { display: none; }
    .panel { top: 86px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee span { animation: none; padding-left: 8px; }
    .cat.typing .sprite, .cat.typing .laptop, .cat[aria-checked="true"] .arrow, .blink,
    .release.nudge, .card[open], .card-sun svg, .zzz, .mochi-note { animation: none; }
    .embers .ch { animation: fadeaway .6s linear forwards; }
    .spark { display: none; }
    @keyframes fadeaway { to { opacity: 0; } }
  }
</style>
</head>
<body>

<div id="app">
  <nav class="menubar" aria-label="MeowChat">
    <span class="mb-brand">MeowChat <b>v3</b></span>
    <div class="seg" role="group" id="langGroup">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh" lang="zh-Hant">繁中</button>
    </div>
    <label class="sr-only" for="theme" data-i18n="themeLabel"></label>
    <select class="mb-select" id="theme"></select>
    <button type="button" class="mb-btn" id="dissolveBtn" aria-haspopup="dialog">
      <span class="ico" id="flameIco"></span><span class="mb-label" data-i18n="dissolve"></span>
    </button>
    <button type="button" class="mb-btn" id="soundBtn" aria-expanded="false" aria-controls="ambience">
      <span class="ico" id="soundIco"></span><span class="mb-label" data-i18n="sound"></span>
    </button>
    <button type="button" class="mb-btn release" id="releaseBtn" aria-haspopup="dialog">
      <span class="ico" id="sunIco"></span><span class="full" data-i18n="release"></span><span class="short" data-i18n="releaseShort"></span>
    </button>
  </nav>

  <div class="page">
    <header class="banner">
      <h1 class="logo">MEOWCHAT 2003<span class="blink">_</span></h1>
      <div class="marquee" aria-hidden="true"><span data-i18n="marquee"></span></div>
      <div class="badges" aria-hidden="true">
        <span class="badge net" data-i18n="badgeBrowser"></span>
        <span class="badge hot" id="visitor"></span>
        <span class="badge" data-i18n="badgeTuna"></span>
      </div>
    </header>

    <main class="desktop">
      <!-- Lobby: the cats -->
      <section class="window" aria-labelledby="lobby-title">
        <div class="titlebar">
          <span class="icon" aria-hidden="true"></span>
          <span class="title" id="lobby-title" data-i18n="lobbyTitle"></span>
          <button class="winbtn" type="button" aria-label="Minimize" data-joke>_</button>
          <button class="winbtn" type="button" aria-label="Maximize" data-joke>□</button>
          <button class="winbtn" type="button" aria-label="Close" data-joke>×</button>
        </div>
        <div class="winbody">
          <div class="room" id="room" role="radiogroup">
            <div class="poster" aria-hidden="true" data-i18n="poster"></div>
          </div>
          <div class="roster" id="roster"></div>
        </div>
      </section>

      <!-- Chat -->
      <section class="window" aria-labelledby="chat-title">
        <div class="titlebar">
          <span class="icon" aria-hidden="true"></span>
          <span class="title" id="chat-title">#meowchat</span>
          <button class="winbtn" type="button" aria-label="Minimize" data-joke>_</button>
          <button class="winbtn" type="button" aria-label="Maximize" data-joke>□</button>
          <button class="winbtn" type="button" aria-label="Close" data-joke>×</button>
        </div>
        <div class="winbody">
          <div class="log" id="log" role="log" aria-live="polite"></div>
          <div class="status" id="status" aria-live="polite">&nbsp;</div>
          <div class="to" id="to" role="radiogroup"><span data-i18n="to"></span></div>
          <form class="prompt" id="form" autocomplete="off">
            <div class="field">
              <label for="input">C:\MEOW&gt;</label>
              <input id="input" type="text" maxlength="200" autofocus>
            </div>
            <button class="send" type="submit" data-i18n="send"></button>
          </form>
        </div>
      </section>

      <!-- Zen Notebook -->
      <section class="window notebook" id="notebook" aria-labelledby="nb-title">
        <div class="titlebar">
          <span class="icon" aria-hidden="true"></span>
          <span class="title"><span id="nb-title" data-i18n="notebookTitle"></span> (<span id="nbCount">0</span>)</span>
          <button class="winbtn" type="button" aria-label="Minimize" data-joke>_</button>
          <button class="winbtn" type="button" aria-label="Close" data-joke>×</button>
        </div>
        <div class="winbody">
          <p class="nb-empty" id="nbEmpty" data-i18n="notebookEmpty"></p>
          <div class="nb-grid" id="nbGrid"></div>
        </div>
      </section>
    </main>
  </div>

  <footer class="taskbar">
    <button class="start" type="button" data-joke data-i18n="start"></button>
    <span class="task" data-i18n="taskChat"></span>
    <button class="task" type="button" id="taskNotebook" data-i18n="taskNotebook"></button>
    <span class="tray">
      <button type="button" class="live" id="liveBtn"><span class="led" aria-hidden="true"></span><span id="liveLabel"></span></button>
      <span id="clock">--:--</span>
    </span>
  </footer>

  <!-- Ambience panel (opened from the Sound button) -->
  <div class="panel window" id="ambience" role="dialog" aria-labelledby="amb-title" hidden>
    <div class="titlebar">
      <span class="icon" aria-hidden="true"></span>
      <span class="title" id="amb-title" data-i18n="ambTitle"></span>
      <button class="winbtn" type="button" id="ambX" aria-label="Close">×</button>
    </div>
    <div class="winbody">
      <label class="vol"><span data-i18n="ambVolume"></span><input type="range" id="vol" min="0" max="100" step="1"></label>
      <div class="toggles">
        <button type="button" class="tog" data-ch="sfx"><span class="box" aria-hidden="true"></span><span data-i18n="chSfx"></span></button>
        <button type="button" class="tog" data-ch="rain"><span class="box" aria-hidden="true"></span><span data-i18n="chRain"></span></button>
        <button type="button" class="tog" data-ch="vinyl"><span class="box" aria-hidden="true"></span><span data-i18n="chVinyl"></span></button>
        <button type="button" class="tog" data-ch="purr"><span class="box" aria-hidden="true"></span><span data-i18n="chPurr"></span></button>
      </div>
      <p class="amb-note" data-i18n="ambNote"></p>
    </div>
  </div>
</div>

<!-- Release / Ground Me: pixel fortune card -->
<dialog class="card" id="card" aria-labelledby="card-title">
  <div class="titlebar">
    <span class="icon" aria-hidden="true"></span>
    <span class="title" id="card-title" data-i18n="cardTitle"></span>
    <button class="winbtn" type="button" id="cardX" aria-label="Close">×</button>
  </div>
  <div class="card-body">
    <button type="button" class="star card-star" id="cardStar" aria-pressed="false"></button>
    <div class="card-no" id="cardNo"></div>
    <div class="card-sun" id="cardSun" aria-hidden="true"></div>
    <p class="fortune" id="fortune"></p>
    <h3 data-i18n="cardRitual"></h3>
    <ol class="ritual" id="ritual"></ol>
    <p class="lucky"><span data-i18n="cardLucky"></span> <b id="lucky"></b></p>
    <div class="card-actions">
      <button class="send" type="button" id="cardGo" data-i18n="cardGo"></button>
      <button class="chip" type="button" id="cardStay" data-i18n="cardStay"></button>
    </div>
  </div>
</dialog>

<!-- Burn the Thought: nothing typed here is stored or sent -->
<dialog class="card dissolve" id="dissolve" aria-labelledby="dissolve-title">
  <div class="titlebar">
    <span class="icon" aria-hidden="true"></span>
    <span class="title" id="dissolve-title" data-i18n="dissolveTitle"></span>
    <button class="winbtn" type="button" id="dissolveX" aria-label="Close">×</button>
  </div>
  <div class="card-body">
    <p class="hint" id="dissolveHint" data-i18n="dissolveHint"></p>
    <div class="burn" id="burn">
      <textarea id="thought" maxlength="280" rows="4" aria-describedby="dissolveHint"></textarea>
      <div class="embers" id="embers" aria-hidden="true"></div>
    </div>
    <button class="send" type="button" id="dissolveGo" data-i18n="dissolveGo"></button>
    <div id="mochiNoteSlot" aria-live="polite"></div>
  </div>
</dialog>

<!-- Shown after "I'm going" -->
<div class="away" id="away" hidden>
  <div class="away-box">
    <div class="away-cats" id="awayCats" aria-hidden="true"></div>
    <p class="zzz" aria-hidden="true">z z z</p>
    <h2 data-i18n="awayTitle"></h2>
    <p data-i18n="awayBody"></p>
    <button class="send" type="button" id="awayBack" data-i18n="awayBack"></button>
  </div>
</div>

<script src="personas.js"></script>
<script src="i18n.js"></script>
<script src="audio.js"></script>
<script>
(() => {
  const P = window.MEOW_PERSONAS;
  const I18N = window.MEOW_I18N;
  const A = window.MeowAudio;

  // Live cats: the Cloudflare Worker in worker/worker.js
  const API_URL = "https://zen-meow-api.superdenis777.workers.dev";
  const API_TIMEOUT_MS = 9000;

  /* ================================================================
     PIXEL SPRITES
     Each sprite is a grid of characters; every char maps to a color.
     "." is transparent. Cats share a base body and patch a few rows.
     ================================================================ */
  const BASE_CAT = [
    "......................", //  0
    "..K..............K....", //  1  ear tips
    "..KOK..........KOK....", //  2
    "..KPOK........KOPK....", //  3
    "..KPOOKKKKKKKKOOPK....", //  4  top of head
    ".KOOOOOOOOOOOOOOOOK...", //  5
    ".KOOOOOOOOOOOOOOOOK...", //  6
    ".KOOEEOOOOOOOOEEOOK...", //  7  eyes
    ".KOOEXOOOOOOOOXEOOK...", //  8
    "wKOOOOOOOPPOOOOOOOKw..", //  9  nose + whiskers
    ".KOOOOOOOKKOOOOOOOK...", // 10
    "wKOOOOOOKOOKOOOOOOKw..", // 11  mouth
    "..KOOOOOOOOOOOOOOK....", // 12
    "...KKOOOOOOOOOOKK...K.", // 13  neck + tail tip
    "..KOOOOWWWWWWOOOOK.KOK", // 14  chest
    ".KOOOOWWWWWWWWOOOOKKOK", // 15
    ".KOOOOWWWWWWWWOOOOKKOK", // 16
    ".KOOOOOWWWWWWOOOOOOOK.", // 17
    ".KOOOOOOOOOOOOOOOOOK..", // 18
    "..KWWKKKKKKKKKKWWK....", // 19  paws
    "...KK..........KK.....", // 20
  ];

  const LAPTOP = [
    "KKKKKKKKKKKKKK",
    "KLLLLLLLLLLLLK",
    "KLLLLFFLLFLLLK", // a fish logo, obviously
    "KLLLFFFFFFLLLK",
    "KLLLLFFLLFLLLK",
    "KLLLLLLLLLLLLK",
    "KKKKKKKKKKKKKK",
    ".KDDDDDDDDDDK.",
    ".KKKKKKKKKKKK.",
  ];

  const SUN = [
    ".....Y.....",
    ".Y...Y...Y.",
    "..Y.....Y..",
    "....OOO....",
    "...OOOOO...",
    "YY.OOOOO.YY",
    "...OOOOO...",
    "....OOO....",
    "..Y.....Y..",
    ".Y...Y...Y.",
    ".....Y.....",
  ];
  const FLAME = [
    "...F...",
    "..FF...",
    "..FFF..",
    ".FFOFF.",
    ".FOOOF.",
    "FFOYOFF",
    "FOYYYOF",
    "FOYYYOF",
    ".FOOOF.",
  ];
  const STAR = [
    "....K....",
    "...KYK...",
    "...KYK...",
    "KKKKYKKKK",
    ".KYYYYYK.",
    "..KYYYK..",
    ".KYYKYYK.",
    ".KYK.KYK.",
    ".KK...KK.",
  ];
  const SPEAKER_ON = [
    "...K.....", "..KK..K..", "KKKK...K.", "KKKK.K.K.",
    "KKKK.K.K.", "KKKK...K.", "..KK..K..", "...K.....",
  ];
  const SPEAKER_OFF = [
    "...K.....", "..KK.....", "KKKK.K.K.", "KKKK..K..",
    "KKKK.K.K.", "KKKK.....", "..KK.....", "...K.....",
  ];

  const patch = (rows, changes) => rows.map((r, i) => changes[i] ?? r);

  function svg(rows, pal, cls = "") {
    const h = rows.length;
    const w = Math.max(...rows.map(r => r.length));
    let rects = "";
    rows.forEach((row, y) => {
      [...row].forEach((ch, x) => {
        if (pal[ch]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[ch]}"/>`;
      });
    });
    return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
  }
  const STAR_SVG = svg(STAR, { K: "#1a1030", Y: "currentColor" });

  // Look + sound for each persona (the words live in personas.js)
  const LOOKS = {
    mochi: {
      pal: { K: "#1a1030", O: "#f3e9d8", W: "#ffffff", P: "#ff9fc2", E: "#fff", X: "#1a1030", w: "#c9b8d9", L: "#3ccf4e", l: "#1f8a32" },
      lid: "#3c8f62",
      sprite: patch(BASE_CAT, {
        0: "........LL............", // a sprout. he's growing.
        1: "..K.....LLl......K....",
        2: "..KOK.....l....KOK....",
        3: "..KPOK....l...KOPK....",
        7: ".KOOOOOOOOOOOOOOOOK...", // eyes: peacefully closed
        8: ".KOOKKKOOOOOOKKKOOK...",
      }),
      chime: { type: "sine", notes: [392, 523.25, 659.25], gap: 0.2, vol: 0.06 },
    },
    nox: {
      pal: { K: "#1a1030", O: "#4a4478", S: "#383262", W: "#8a83b8", P: "#ff8fb8", E: "#fff", X: "#1a1030", w: "#ffffff", G: "#0e0e14", g: "#39ff14" },
      lid: "#2b2b3b",
      sprite: patch(BASE_CAT, {
        5: ".KOOOOSOSSOSOOOOOOK...",
        6: ".KOOOOOSOOSOOOOOOOK...",
        7: ".KOGGGGGKKKKGGGGGOK...", // shades on, always
        8: ".KOGgGGGOOOOGgGGGOK...",
      }),
      chime: { type: "square", notes: [659.25, 493.88], gap: 0.09, vol: 0.025 },
    },
    kiki: {
      pal: { K: "#1a1030", O: "#e3d3ff", W: "#ffffff", P: "#ff8fb8", E: "#ffd23f", X: "#1a1030", w: "#ffffff", H: "#5b3bd6", h: "#3d24a8", y: "#ffe347" },
      lid: "#5b3bd6",
      sprite: patch(BASE_CAT, {
        0: "..........H...........", // a wizard hat, with a star
        1: "..K......HHH.....K....",
        2: "..KOK...HHyHH..KOK....",
        3: "..KPOK.HHHHHHHKOPK....",
        4: "..KPOhhhhhhhhhhOPK....",
        6: ".KOOKOKOOOOOOKOKOOK...", // lashes
      }),
      chime: { type: "triangle", notes: [1046.5, 1318.5, 1568, 2093], gap: 0.07, vol: 0.045 },
    },
  };

  const CATS = P.CATS.map(c => ({ ...c, ...LOOKS[c.id], state: { turn: 0, hintedAt: -99 }, pending: 0, history: [] }));
  const byId = id => CATS.find(c => c.id === id);

  /* ================================================================
     SMALL HELPERS
     ================================================================ */
  const $ = id => document.getElementById(id);
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode etc. */ } },
  };
  const hasHan = s => /\p{Script=Han}/u.test(s);

  let lang = store.get("meow.lang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
  const t = (key, vars = {}) => String(I18N[lang][key]).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

  /* ================================================================
     LOCAL REPLY ENGINE (always runs; it's also the offline fallback)
     Each cat walks its own 6-layer arc (personas.js → arc). Signals in
     the message (body, loops, stuck, choice, goodbye) jump straight to
     the matching layer for that turn. Lines come from shuffle bags so
     nothing repeats back to back.
     ================================================================ */
  const bags = new WeakMap();
  function draw(lines) {
    let bag = bags.get(lines);
    if (!bag || bag.items.length === 0) {
      const items = [...lines];
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      if (bag && items.length > 1 && items[items.length - 1] === bag.last) items.unshift(items.pop());
      bag = { items, last: null };
      bags.set(lines, bag);
    }
    bag.last = bag.items.pop();
    return bag.last;
  }

  function pickWord(msg) {
    const words = (msg.match(/[\p{L}\p{N}']{3,}/gu) || []).filter(w => w.length <= 16 && !hasHan(w));
    return words.length ? rand(words).toLowerCase() : "that";
  }

  function respond(cat, msg) {
    const L = hasHan(msg) ? "zh" : lang; // answer in the language they wrote in
    const signal = P.SIGNALS.find(s => s.re.test(msg));
    if (signal && signal.layer === "safety") return { text: P.SAFETY.reply[L], L, safety: true };

    const natural = cat.arc[cat.state.turn % cat.arc.length];
    const layer = signal ? signal.layer : natural;
    cat.state.turn++;
    let text = draw(cat.lines[layer][L]);
    if (L === "en") text = text.replaceAll("{word}", pickWord(msg));
    return { text, L, layer };
  }

  /* ================================================================
     LIVE CATS — Gemini via the Worker, with automatic fallback
     ================================================================ */
  let liveMode = store.get("meow.live") !== "off";
  let liveState = "idle"; // idle | live | fallback
  let cooldownUntil = 0;

  async function askLive(cat, msg, layer, L) {
    if (!liveMode || !navigator.onLine || Date.now() < cooldownUntil) return null;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), API_TIMEOUT_MS);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: msg, cat: cat.id, history: cat.history.slice(-12), lang: L, layer }),
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      const reply = typeof data.reply === "string" ? data.reply.trim().slice(0, 600) : "";
      if (!reply) throw new Error("empty");
      setLiveState("live");
      return reply;
    } catch (err) {
      // rate-limited → back off a minute; offline/down → two minutes
      cooldownUntil = Date.now() + (err.message === "429" ? 60_000 : 120_000);
      setLiveState("fallback");
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  function setLiveState(s) { liveState = s; renderLive(); }
  function renderLive() {
    const btn = $("liveBtn");
    const state = !liveMode ? "off" : liveState;
    btn.dataset.state = state;
    $("liveLabel").textContent = t(liveMode ? "liveOn" : "liveOff");
    const tip = !liveMode ? t("liveTipOff") : state === "fallback" ? t("liveTipFallback") : t("liveTipOn");
    btn.title = tip;
    btn.setAttribute("aria-label", tip);
    btn.setAttribute("aria-pressed", String(liveMode));
  }
  $("liveBtn").addEventListener("click", () => {
    liveMode = !liveMode;
    store.set("meow.live", liveMode ? "on" : "off");
    cooldownUntil = 0;
    liveState = "idle";
    renderLive();
    sys(t(liveMode ? "sysLiveOn" : "sysLiveOff"));
  });

  /* ================================================================
     DOM: build the room, roster and chips
     ================================================================ */
  const room = $("room"), roster = $("roster"), to = $("to"), log = $("log");
  const status = $("status"), form = $("form"), input = $("input"), title = $("chat-title");

  let selected = CATS[0];

  CATS.forEach(cat => {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "cat" + (cat.pace > 1.2 ? " slow" : "");
    el.setAttribute("role", "radio");
    el.style.setProperty("--cat-color", cat.color);
    el.innerHTML = `
      <span class="arrow" aria-hidden="true"></span>
      <span class="bubble" aria-hidden="true"></span>
      <span class="rig">
        ${svg(cat.sprite, cat.pal, "sprite")}
        ${svg(LAPTOP, { K: "#1a1030", L: cat.lid, F: "#ffffff", D: "#c9c3d6" }, "laptop")}
      </span>
      <span class="shadow" aria-hidden="true"></span>
      <span class="nameplate"></span>
      <span class="lamps" aria-hidden="true">${"<i></i>".repeat(6)}</span>`;
    el.querySelector(".nameplate").textContent = cat.name;
    el.addEventListener("click", () => select(cat, true));
    room.appendChild(el);
    cat.el = el;
    cat.bubble = el.querySelector(".bubble");
    cat.lamps = [...el.querySelectorAll(".lamps i")];

    const p = document.createElement("p");
    p.style.setProperty("--cat-color", cat.color);
    p.innerHTML = "<b></b><span></span>";
    p.querySelector("b").textContent = cat.name;
    roster.appendChild(p);
    cat.bioEl = p.querySelector("span");

    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.setAttribute("role", "radio");
    chip.style.setProperty("--cat-color", cat.color);
    chip.textContent = cat.name;
    chip.addEventListener("click", () => select(cat, true));
    to.appendChild(chip);
    cat.chip = chip;
  });

  $("sunIco").innerHTML = svg(SUN, { Y: "#c27a00", O: "#ff8a00" });
  $("cardSun").innerHTML = svg(SUN, { Y: "#ffb000", O: "#ffe347" });
  $("flameIco").innerHTML = svg(FLAME, { F: "#ff5a36", O: "#ffa630", Y: "#ffe347" });
  $("soundIco").innerHTML = svg(SPEAKER_ON, { K: "#1a1030" }, "ico-on") + svg(SPEAKER_OFF, { K: "#1a1030" }, "ico-off");
  $("awayCats").innerHTML = CATS.map(c => svg(c.sprite, c.pal)).join("");
  $("cardStar").innerHTML = STAR_SVG;

  function select(cat, focusInput) {
    selected = cat;
    CATS.forEach(c => {
      const on = String(c === cat);
      c.el.setAttribute("aria-checked", on);
      c.chip.setAttribute("aria-checked", on);
      c.el.tabIndex = c.chip.tabIndex = c === cat ? 0 : -1;
    });
    title.textContent = t("chatTitle", { name: cat.name });
    input.placeholder = t("placeholder", { name: cat.name });
    if (focusInput) input.focus();
  }

  // arrow keys move between cats inside either radiogroup
  [room, to].forEach(group => group.addEventListener("keydown", e => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    const next = CATS[(CATS.indexOf(selected) + step + CATS.length) % CATS.length];
    select(next, false);
    (group === room ? next.el : next.chip).focus();
  }));

  /* ================================================================
     ZEN NOTEBOOK — saved fortunes + favourite cat lines (localStorage)
     ================================================================ */
  const Notebook = (() => {
    const KEY = "meow.notebook";
    let items = [];
    try { items = JSON.parse(store.get(KEY) || "[]"); } catch { items = []; }
    if (!Array.isArray(items)) items = [];
    items = items.filter(i => i && typeof i.id === "string" && typeof i.text === "string");
    const persist = () => store.set(KEY, JSON.stringify(items.slice(0, 200)));
    return {
      get all() { return items; },
      has: id => items.some(i => i.id === id),
      add(entry) { if (!this.has(entry.id)) { items.unshift({ ...entry, savedAt: Date.now() }); persist(); } },
      remove(id) { items = items.filter(i => i.id !== id); persist(); },
    };
  })();

  function starButton(entry) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "star";
    btn.dataset.id = entry.id;
    btn.innerHTML = STAR_SVG;
    btn.addEventListener("click", () => toggleSaved(entry));
    syncStar(btn);
    return btn;
  }
  function syncStar(btn) {
    const saved = Notebook.has(btn.dataset.id);
    btn.setAttribute("aria-pressed", String(saved));
    btn.setAttribute("aria-label", t(saved ? "remove" : "save"));
    btn.title = t(saved ? "remove" : "save");
  }
  function toggleSaved(entry) {
    if (Notebook.has(entry.id)) Notebook.remove(entry.id);
    else { Notebook.add(entry); A.chime({ type: "triangle", notes: [880, 1318.5], gap: 0.08, vol: 0.03 }); }
    document.querySelectorAll(".star[data-id]").forEach(b => { if (b.dataset.id === entry.id) syncStar(b); });
    renderNotebook();
  }

  function renderNotebook() {
    const items = Notebook.all;
    $("nbCount").textContent = items.length;
    $("nbEmpty").hidden = items.length > 0;
    $("nbGrid").replaceChildren(...items.map(item => {
      const card = document.createElement("article");
      card.className = "nb-card";
      const head = document.createElement("div");
      head.className = "nb-head";
      const label = document.createElement("b");
      if (item.kind === "cat") {
        const cat = byId(item.cat);
        label.textContent = cat ? cat.name : String(item.cat || "").toUpperCase();
        if (cat) card.style.setProperty("--cat-color", cat.color);
      } else {
        label.textContent = `${t("fortuneLabel")} ${item.no || ""}`.trim();
      }
      const when = document.createElement("time");
      const d = new Date(item.savedAt || Date.now());
      when.dateTime = d.toISOString();
      when.textContent = d.toLocaleDateString(lang === "zh" ? "zh-TW" : "en", { month: "short", day: "numeric" });
      head.append(label, when);
      const text = document.createElement("p");
      text.textContent = item.text;
      card.append(head, text);
      if (item.kind === "fortune") {
        if (Array.isArray(item.ritual) && item.ritual.length) {
          const ul = document.createElement("ul");
          item.ritual.forEach(r => ul.appendChild(Object.assign(document.createElement("li"), { textContent: String(r) })));
          card.appendChild(ul);
        }
        if (item.lucky) card.appendChild(Object.assign(document.createElement("p"), { className: "nb-lucky", textContent: `${t("cardLucky")} ${item.lucky}` }));
      }
      const del = document.createElement("button");
      del.type = "button";
      del.className = "winbtn nb-del";
      del.textContent = "×";
      del.setAttribute("aria-label", t("remove"));
      del.addEventListener("click", () => toggleSaved(item));
      card.appendChild(del);
      return card;
    }));
  }

  $("taskNotebook").addEventListener("click", () => {
    $("notebook").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  /* ---------- chat log ---------- */
  const clock = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  function addLine({ nick, text, color, kind, cat }) {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const line = document.createElement("p");
    line.className = "msg" + (kind ? " " + kind : "");
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = `[${clock()}] `;
    line.appendChild(time);
    if (nick) {
      const n = document.createElement("span");
      n.className = "nick";
      n.textContent = `<${nick}> `;
      if (color) n.style.color = color;
      line.appendChild(n);
    }
    line.appendChild(document.createTextNode(text));
    if (cat) line.appendChild(starButton({ id: uid(), kind: "cat", cat: cat.id, text }));
    log.appendChild(line);
    if (atBottom || kind === "you") log.scrollTop = log.scrollHeight;
  }
  const sys = (text, kind = "sys") => addLine({ text: "*** " + text, kind });

  /* ---------- typing + speech ---------- */
  function updateStatus() {
    const typing = CATS.filter(c => c.pending > 0).map(c => c.name);
    status.textContent = "";
    if (!typing.length) { status.innerHTML = "&nbsp;"; return; }
    const who = typing.length === 1 ? typing[0] : typing.slice(0, -1).join(", ") + t("and") + typing.at(-1);
    status.append(t(typing.length === 1 ? "typingOne" : "typingMany", { who }));
    const cur = document.createElement("span");
    cur.className = "blink";
    cur.textContent = "▌";
    status.append(" ", cur);
  }

  function speak(cat, text) {
    cat.bubble.textContent = "";
    const b = document.createElement("b");
    b.textContent = cat.name + ": ";
    const says = document.createElement("span");
    says.append(b, text);
    cat.bubble.append(says);
    cat.bubble.classList.add("show");
    clearTimeout(cat.bubbleTimer);
    cat.bubbleTimer = setTimeout(() => cat.bubble.classList.remove("show"), 6500);
  }

  const lightLamp = (cat, layer) => cat.lamps.forEach((l, i) => l.classList.toggle("on", i === layer));
  // typing time scales with length; Mochi takes his time on purpose
  const typingTime = (cat, text) => Math.min(4800, (500 + text.length * 20 + Math.random() * 700) * cat.pace);

  function startTyping(cat) {
    cat.pending++;
    cat.el.classList.add("typing");
    if (!cat.ticker) cat.ticker = setInterval(() => Math.random() < 0.55 && A.tick(), 120);
    updateStatus();
  }
  function stopTyping(cat) {
    cat.pending--;
    if (cat.pending === 0) {
      cat.el.classList.remove("typing");
      clearInterval(cat.ticker);
      cat.ticker = null;
    }
    updateStatus();
  }
  function deliver(cat, text, layer) {
    addLine({ nick: cat.name, text, color: cat.color, cat });
    speak(cat, text);
    if (layer !== null && layer !== undefined) lightLamp(cat, layer);
    A.chime(cat.chime);
  }

  // scripted lines (greetings, nudges, welcome-backs)
  function catSays(cat, text, { delay = 0, layer = null, after, urgent = false } = {}) {
    setTimeout(() => startTyping(cat), delay);
    setTimeout(() => {
      stopTyping(cat);
      deliver(cat, text, layer);
      if (after) after();
    }, delay + (urgent ? 600 : typingTime(cat, text)));
  }

  // a real reply: the local engine picks the layer, Gemini (when live) writes the words
  async function converse(cat, msg) {
    const r = respond(cat, msg);
    if (r.safety) { // never sent anywhere; fixed, sincere, fast
      catSays(cat, r.text, { urgent: true, after: () => sys(P.SAFETY.sys[r.L], "care") });
      return;
    }
    await sleep(250);
    startTyping(cat);
    const t0 = performance.now();
    const live = await askLive(cat, msg, r.layer, r.L);
    const text = live || r.text;
    await sleep(Math.max(350, typingTime(cat, text) * (live ? 0.6 : 1) - (performance.now() - t0)));
    stopTyping(cat);
    deliver(cat, text, r.layer);
    cat.history.push({ role: "user", text: msg }, { role: "model", text });
    if (cat.history.length > 24) cat.history.splice(0, cat.history.length - 24);
    // at the end of the arc, point gently at the exit (not every time)
    if (r.layer === 5 && cat.state.turn - cat.state.hintedAt > 3) {
      cat.state.hintedAt = cat.state.turn;
      nudgeRelease(cat);
    }
  }

  /* ---------- sending ---------- */
  const releaseBtn = $("releaseBtn");
  function nudgeRelease(cat) {
    sys(t("sysRelease", { name: cat.name }));
    releaseBtn.classList.remove("nudge");
    void releaseBtn.offsetWidth;
    releaseBtn.classList.add("nudge");
  }

  input.addEventListener("keydown", e => {
    if (e.key.length === 1 || e.key === "Backspace") A.key();
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const msg = input.value.trim();
    if (!msg) {
      form.classList.remove("shake");
      void form.offsetWidth; // restart animation
      form.classList.add("shake");
      return;
    }
    input.value = "";
    A.send();
    addLine({ nick: t("you", { name: selected.name }), text: msg, kind: "you" });
    converse(selected, msg);
  });

  /* ---------- window-button jokes ---------- */
  document.querySelectorAll("[data-joke]").forEach(btn =>
    btn.addEventListener("click", () => sys(rand(I18N[lang].jokes)))
  );

  /* ================================================================
     RELEASE TO LIFE
     ================================================================ */
  const card = $("card"), away = $("away"), app = $("app");
  const pickN = (arr, n) => [...arr].sort(() => Math.random() - 0.5).slice(0, n);
  let currentFortune = null;

  function openCard() {
    const S = I18N[lang];
    const no = String(1 + Math.floor(Math.random() * 999)).padStart(3, "0");
    currentFortune = { id: uid(), kind: "fortune", no, text: rand(S.fortunes), ritual: pickN(S.rituals, 3), lucky: rand(S.lucky) };
    $("cardNo").textContent = t("cardNo", { n: no });
    $("fortune").textContent = currentFortune.text;
    $("ritual").replaceChildren(...currentFortune.ritual.map(r => Object.assign(document.createElement("li"), { textContent: r })));
    $("lucky").textContent = currentFortune.lucky;
    $("cardStar").dataset.id = currentFortune.id;
    syncStar($("cardStar"));
    A.release();
    card.showModal();
    $("cardGo").focus();
  }
  $("cardStar").addEventListener("click", () => currentFortune && toggleSaved(currentFortune));

  let nudgeTimer;
  function armNudge() {
    clearTimeout(nudgeTimer);
    // after a long stretch, Mochi suggests a break, once
    nudgeTimer = setTimeout(() => {
      const mochi = byId("mochi");
      catSays(mochi, mochi.nudge[lang], { layer: 5, after: () => nudgeRelease(mochi) });
    }, 12 * 60 * 1000);
  }

  function goAway() {
    card.close();
    clearTimeout(nudgeTimer);
    closePanel();
    A.pauseAmbience();
    sys(t("sysStepped", { time: clock() }));
    app.inert = true;
    away.hidden = false;
    $("awayBack").focus();
  }

  function comeBack() {
    away.hidden = true;
    app.inert = false;
    A.resumeAmbience();
    sys(t("sysBack"));
    catSays(selected, rand(selected.back[lang]), { delay: 300, layer: 0 });
    CATS.forEach(c => { c.state.turn = 0; }); // fresh arc, fresh baseline
    armNudge();
    input.focus();
  }

  releaseBtn.addEventListener("click", openCard);
  $("cardGo").addEventListener("click", goAway);
  $("cardStay").addEventListener("click", () => card.close());
  $("cardX").addEventListener("click", () => card.close());
  $("awayBack").addEventListener("click", comeBack);

  /* ================================================================
     BURN THE THOUGHT — the text turns to embers and light, then Mochi
     says one grounding line. Nothing is stored, logged or sent.
     ================================================================ */
  const dissolve = $("dissolve"), burn = $("burn"), thought = $("thought"), embers = $("embers");
  let burning = false;

  function openDissolve() {
    $("mochiNoteSlot").replaceChildren();
    thought.value = "";
    dissolve.showModal();
    thought.focus();
  }

  function burnThought() {
    if (burning) return;
    if (!thought.value.trim()) {
      burn.classList.remove("shake");
      void burn.offsetWidth;
      burn.classList.add("shake");
      thought.focus();
      return;
    }
    burning = true;
    $("mochiNoteSlot").replaceChildren();
    const chars = [...thought.value];
    const stagger = Math.min(18, 900 / chars.length);
    embers.replaceChildren(...chars.map((ch, i) => {
      if (ch === "\n") return document.createElement("br");
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = ch;
      s.style.setProperty("--d", `${Math.round(i * stagger + Math.random() * 180)}ms`);
      s.style.setProperty("--dx", `${Math.round(Math.random() * 60 - 30)}px`);
      s.style.setProperty("--dy", `${Math.round(-40 - Math.random() * 110)}px`);
      return s;
    }));
    // pixel sparkles rising out of the text
    const box = burn.getBoundingClientRect();
    const colors = ["#ffe347", "#ffffff", "#ffb000", "#ff9ecf", "#8be9fd"];
    for (let i = 0; i < 46; i++) {
      const sp = document.createElement("i");
      sp.className = "spark";
      sp.style.left = `${Math.random() * (box.width - 8)}px`;
      sp.style.top = `${20 + Math.random() * (box.height - 30)}px`;
      sp.style.setProperty("--c", rand(colors));
      sp.style.setProperty("--d", `${Math.round(Math.random() * 1300)}ms`);
      sp.style.setProperty("--dx", `${Math.round(Math.random() * 50 - 25)}px`);
      sp.style.setProperty("--dy", `${Math.round(-30 - Math.random() * 90)}px`);
      embers.appendChild(sp);
    }
    burn.classList.add("burning");
    thought.value = ""; // the words only live in the embers now
    A.shimmer();

    const total = Math.min(chars.length * stagger + 180 + 1500 + 200, 3600);
    setTimeout(() => {
      embers.replaceChildren();
      burn.classList.remove("burning");
      burning = false;
      const mochi = byId("mochi");
      const note = document.createElement("p");
      note.className = "mochi-note";
      note.innerHTML = svg(mochi.sprite, mochi.pal);
      const words = document.createElement("span");
      const b = document.createElement("b");
      b.textContent = "MOCHI: ";
      b.style.color = "#2f8f45";
      words.append(b, rand(I18N[lang].mochiNotes));
      note.appendChild(words);
      $("mochiNoteSlot").replaceChildren(note);
      A.chime(mochi.chime);
    }, total);
  }

  $("dissolveBtn").addEventListener("click", openDissolve);
  $("dissolveGo").addEventListener("click", burnThought);
  $("dissolveX").addEventListener("click", () => dissolve.close());
  thought.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); burnThought(); }
    else if (e.key.length === 1 || e.key === "Backspace") A.key();
  });
  dissolve.addEventListener("close", () => { thought.value = ""; }); // don't keep it around

  // clicking the dimmed backdrop closes either dialog
  [card, dissolve].forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

  /* ================================================================
     AMBIENCE PANEL
     ================================================================ */
  const panel = $("ambience"), soundBtn = $("soundBtn"), vol = $("vol");

  function renderAudio() {
    const s = A.state;
    vol.value = Math.round(s.volume * 100);
    panel.querySelectorAll(".tog").forEach(b => b.setAttribute("aria-pressed", String(!!s[b.dataset.ch])));
    soundBtn.dataset.on = String(A.anyOn);
  }
  function openPanel() { panel.hidden = false; soundBtn.setAttribute("aria-expanded", "true"); panel.querySelector(".tog").focus(); }
  function closePanel() { panel.hidden = true; soundBtn.setAttribute("aria-expanded", "false"); }

  soundBtn.addEventListener("click", () => (panel.hidden ? openPanel() : closePanel()));
  $("ambX").addEventListener("click", () => { closePanel(); soundBtn.focus(); });
  panel.querySelectorAll(".tog").forEach(b => b.addEventListener("click", () => {
    const ch = b.dataset.ch;
    A.set(ch, !A.state[ch]);
    if (ch === "sfx" && A.state.sfx) A.chime(selected.chime);
  }));
  vol.addEventListener("input", () => A.setVolume(vol.value / 100));
  document.addEventListener("pointerdown", e => {
    if (!panel.hidden && !panel.contains(e.target) && !soundBtn.contains(e.target)) closePanel();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !panel.hidden) { closePanel(); soundBtn.focus(); }
  });
  A.onChange(renderAudio);

  /* ================================================================
     THEMES
     ================================================================ */
  const THEMES = ["midnight", "sunset", "matcha", "rose"];
  const themeSel = $("theme");
  let theme = THEMES.includes(store.get("meow.theme")) ? store.get("meow.theme") : "midnight";
  function applyTheme(next) {
    theme = next;
    document.documentElement.dataset.theme = theme;
    themeSel.value = theme;
    store.set("meow.theme", theme);
  }
  function renderThemeOptions() {
    themeSel.replaceChildren(...THEMES.map(id => Object.assign(document.createElement("option"), { value: id, textContent: I18N[lang].themes[id] })));
    themeSel.value = theme;
  }
  themeSel.addEventListener("change", () => applyTheme(themeSel.value));

  /* ================================================================
     LANGUAGE
     ================================================================ */
  const visitor = String(1000000 + Math.floor(Math.random() * 999999)).slice(1);

  function applyLang(next, announce) {
    lang = next;
    store.set("meow.lang", lang);
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("#langGroup button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("langGroup").setAttribute("aria-label", t("langLabel"));
    $("visitor").textContent = t("badgeVisitor", { n: visitor });
    room.setAttribute("aria-label", t("roomLabel"));
    to.setAttribute("aria-label", t("toLabel"));
    log.setAttribute("aria-label", t("logLabel"));
    thought.placeholder = t("dissolvePlaceholder");
    soundBtn.title = t("sound");
    $("dissolveBtn").title = t("dissolve");
    CATS.forEach(c => {
      c.el.setAttribute("aria-label", t("talkTo", { name: c.name }));
      c.bioEl.textContent = c.bio[lang];
    });
    document.querySelectorAll(".star[data-id]").forEach(syncStar);
    renderThemeOptions();
    renderNotebook();
    renderLive();
    select(selected, false);
    if (announce) {
      sys(t("sysLang"));
      catSays(selected, rand(selected.greet[lang]), { delay: 200, layer: 0 });
    }
  }

  document.querySelectorAll("#langGroup button").forEach(b =>
    b.addEventListener("click", () => { if (b.dataset.lang !== lang) applyLang(b.dataset.lang, true); })
  );

  /* ---------- tray clock ---------- */
  const tick = () => { $("clock").textContent = clock(); };
  tick();
  setInterval(tick, 10000);

  /* ---------- boot ---------- */
  applyTheme(theme);
  applyLang(lang, false);
  renderAudio();
  A.restore(); // saved ambience resumes after the first click/keypress
  select(CATS[0], false);
  sys(t("sysJoined"));
  sys(t("sysHere", { names: CATS.map(c => c.name).join(", ") }));
  sys(t("sysHint"));
  sys(t(liveMode ? "sysLiveOn" : "sysLiveOff"));
  CATS.forEach((cat, i) => catSays(cat, rand(cat.greet[lang]), { delay: 500 + i * 1400, layer: 0 }));
  armNudge();
})();
</script>
</body>
</html>
