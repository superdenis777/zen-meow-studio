# Hotel Dada presence Worker. Deployed by .github/workflows/deploy-presence.yml.
name = "hotel-dada-presence"
main = "worker.js"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed class: the kind available on the Workers free plan (it stores nothing anyway).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
