# Deploys presence/ (the Hotel Dada presence Worker) to Cloudflare when it changes, or on
# demand from the Actions tab. Uses the same secrets as deploy-worker.yml.
name: Deploy presence Worker

on:
  push:
    branches: [main, claude/tender-goldberg-a0ahf0]
    paths: ["presence/**", "tests/presence.test.mjs", ".github/workflows/deploy-presence.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-presence
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/presence.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy with wrangler
        working-directory: presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
