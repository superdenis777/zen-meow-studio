# Deploys worker/ to Cloudflare whenever it changes on main (or on demand
# from the Actions tab). Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   – Cloudflare token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – shown on the Cloudflare Workers & Pages overview
# The Gemini key is NOT needed here: it stays a Worker secret on Cloudflare.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy with wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
