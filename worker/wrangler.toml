name = "zen-meow-api"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# Comma-separated. Add "null" to also allow the page opened straight from disk.
ALLOWED_ORIGINS = "https://superdenis777.github.io"
# Optional. Defaults to gemini-3.8-flash. If Google retires it, its error message
# names the replacement: set that here (or in the dashboard) and redeploy.
# GEMINI_MODEL = "gemini-3.8-flash"
# Backup model, used only when the main one is overloaded or slow.
# Defaults to gemini-3.5-flash-lite; "none" turns the backup off.
# GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"

# The Gemini key is a secret, never a var:
#   npx wrangler secret put GEMINI_API_KEY

# Optional per-IP rate limit (recommended: the Worker URL is public).
# worker.js uses it automatically when the RATE_LIMITER binding exists.
# Check Cloudflare's "Rate Limiting binding" docs for the current syntax.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }

# Run near Google's US region instead of the visitor's nearest edge. Gemini
# refuses some Cloudflare locations (e.g. Hong Kong → 400 "User location is
# not supported for the API use"), which can serve visitors from Taiwan.
# Only applies when deploying with `npx wrangler deploy` (not dashboard edits).
[placement]
region = "gcp:us-central1"
